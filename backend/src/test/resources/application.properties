spring.datasource.url=jdbc:h2:mem:noteapp;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.docker.compose.enabled=false

logging.level.root=WARN
logging.level.com.hirelens.noteapp=INFO

app.jwt.secret=test-secret-test-secret-test-secret-0123456789
app.jwt.issuer=noteapp-test
app.jwt.expiration=1h

app.cors.allowed-origins=http://localhost:5173

app.ratelimit.login.capacity=5
app.ratelimit.login.window=15m
app.ratelimit.global.capacity=10000
app.ratelimit.global.window=1m

app.admin.password=
